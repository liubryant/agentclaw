plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.ksp)
    id 'com.google.gms.google-services'
    id("com.google.firebase.crashlytics")
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def signingStoreFile = keystoreProperties['storeFile']
def signingStorePassword = keystoreProperties['storePassword']
def signingKeyAlias = keystoreProperties['keyAlias']
def signingKeyPassword = keystoreProperties['keyPassword']
def hasSigningConfig = signingStoreFile && signingStorePassword && signingKeyAlias && signingKeyPassword
def releaseTaskRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase(Locale.ROOT).contains("release")
}

if (releaseTaskRequested && !hasSigningConfig) {
    throw new GradleException(
            "Release signing requires keystore.properties with storeFile, storePassword, keyAlias, and keyPassword. " +
                    "Debug builds use the default Android debug keystore when this file is missing."
    )
}

android {
    namespace 'ai.cjym.agentclaw'
    compileSdk 34

    lint {
        disable 'NullSafeMutableLiveData'
    }

    defaultConfig {
        applicationId "ai.cjym.agentclaw"
        minSdk 24
        targetSdk 34
        versionCode 9
        versionName "1.3.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters "arm64-v8a"
        }

        ksp {
            arg("room.schemaLocation", "$projectDir/schemas")
        }
    }

    signingConfigs {
        if (hasSigningConfig) {
            release {
                storeFile file(signingStoreFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
                enableV3Signing = true
                enableV4Signing = true
            }
            debug {
                storeFile file(signingStoreFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
                enableV3Signing = true
                enableV4Signing = true
            }
        }
    }


    android.applicationVariants.all { variant ->
        variant.outputs.all {
            def createTime = new Date().format("yyyyMMddhhmm")
            outputFileName = "AgentClaw" +
                    "-${variant.buildType.name}-v${variant.versionName}-${createTime}.apk"
        }
    }

    buildTypes {
        debug {
            ndk {
                abiFilters "arm64-v8a"
            }
            if (hasSigningConfig) {
                signingConfig signingConfigs.debug
            }
            minifyEnabled = false
            shrinkResources = false
            manifestPlaceholders = [ALIPAY_SCHEME: "alipayagentclaw"]
        }

        release {
            ndk {
                abiFilters "arm64-v8a"
            }
            if (hasSigningConfig) {
                signingConfig signingConfigs.release
            }
            minifyEnabled = true
            shrinkResources = true
            firebaseCrashlytics {
                mappingFileUploadEnabled = false
                nativeSymbolUploadEnabled = false
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            manifestPlaceholders = [ALIPAY_SCHEME: "alipayagentclaw"]
        }
    }

    aaptOptions {
        // Asset files that are already compressed; prevent aapt2 from
        // double-compressing them. Required for openFd() to work on large assets.
        noCompress 'gz', 'xz', 'bin', 'tar.gz', 'tar.xz', 'mp4'
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    buildFeatures {
        dataBinding true
        viewBinding true
        buildConfig true
        aidl true
    }
}

